[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybergarden-viniti"
version = "0.1.0"
description = "PDF evidence extraction workspace for VINITI"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber==0.11.9",
    "reportlab==4.4.9",
    "pypdf==6.21.4",
    "pymupdf==2.1",
]

[project.scripts]
viniti = "viniti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["viniti*", "rag*"]

[tool.pyright]
extraPaths = ["src"]
