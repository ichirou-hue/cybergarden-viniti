<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Паспорт статьи · Паспорта публикаций</title>
<link rel="stylesheet" href="/solar.css">
<script type="module" src="/solar-ui.mjs"></script>
</head>
<body>
<header class="top"><div class="shell masthead"><a class="brand" href="/"><span class="mark" aria-hidden="true">✳</span> Паспорт статьи</a><span class="context">ВИНИТИ РАН / CyberGarden</span></div></header>
<main class="shell">
<section class="hero">
  <div><p class="eyebrow">Проверка научных данных</p><h1>Паспорт<br>публикации<span>.</span></h1>
  <p class="lede">Результаты измерений, проверка значений и доказательства из статьи.</p></div>
  <div class="actions">
    <label class="button primary" for="passport">Импорт паспорта JSON</label><input id="passport" class="file" type="file" accept=".json,application/json">
    <label class="button" for="sourcePdf">Привязать исходный PDF</label><input id="sourcePdf" class="file" type="file" accept=".pdf,application/pdf">
  </div>
</section>
<p id="notice" role="status"></p>
<section class="stats" aria-label="Сводка паспорта">
 <div><span>Извлечено результатов</span><strong id="total"></strong></div>
 <div><span>Прошли проверку</span><strong id="passed"></strong></div>
 <div><span>Требуют разбора</span><strong id="review"></strong></div>
</section>
<div class="workspace">
<section class="panel catalog" aria-labelledby="catalog-title">
 <header class="panel-head"><div><p class="eyebrow" id="dataset"></p><h2 id="catalog-title">Результаты</h2></div><button id="export" class="button">Скачать CSV</button></header>
 <div class="filters"><label>Поиск<input id="query" type="search" placeholder="Показатель, контекст, цитата…"></label>
 <label>Метрика<select id="metric"></select></label>
 <label>Проверка<select id="status"><option value="">Все</option><option value="passed">Пройдена</option><option value="review">На разборе</option><option value="pending">Ожидает</option></select></label></div>
 <div class="table-wrap"><table><thead><tr><th scope="col">Метрика</th><th scope="col">Значение</th><th scope="col">Контекст</th><th scope="col">Проверка</th></tr></thead><tbody id="results"></tbody></table></div>
 <p id="count" class="foot" aria-live="polite"></p>
</section>
<aside class="panel detail" aria-labelledby="detail-title">
 <header class="panel-head"><div><p class="eyebrow">Карточка результата</p><h2 id="detail-title">Источник и проверка</h2></div></header>
 <div id="detail"></div>
</aside>
</div>
</main>
</body>
</html>
