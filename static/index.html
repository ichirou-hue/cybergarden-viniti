<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ВИНИТИ · Каталог результатов</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#view" onclick="event.preventDefault(); document.getElementById('view').focus()">К содержанию</a>
<header class="top">
  <div class="wrap masthead">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true">✳</span>ВИНИТИ РАН<span>CyberGarden</span></a>
    <span class="context" id="context">Проверка научных данных · каталог результатов</span>
  </div>
</header>
<div class="wrap toolbar">
  <div class="track-switch" id="tracks" role="group" aria-label="Предметная область"></div>
  <a class="button secondary nav-link" id="passportLink" href="#/passport">Паспорт</a>
  <form id="upload" class="upload">
    <label class="file"><span id="fileName">Загрузить PDF</span>
      <input id="file" type="file" accept=".pdf,application/pdf">
    </label>
    <button type="submit">Разобрать</button>
    <button type="button" id="demo" class="secondary">Демо</button>
    <label class="file">Импорт паспорта JSON
      <input id="passport" type="file" accept=".json,application/json">
    </label>
    <span id="uploadState" class="upload-state" role="status"></span>
  </form>
</div>

<main class="wrap" id="view" tabindex="-1"></main>
<p id="status" class="status" role="status"></p>
<noscript><p class="notice bad wrap">Для работы интерфейса нужен JavaScript.</p></noscript>
<p id="bootError" class="notice bad wrap" hidden>
  Не удалось загрузить интерфейс. Обновите страницу; если ошибка повторяется —
  запустите сервер: <code>.venv/bin/python tools/mock_api.py</code>.
</p>

<dialog id="evidence" aria-labelledby="evidenceTitle">
  <div class="bar">
    <h2 id="evidenceTitle"></h2>
    <a id="evidencePdf" href="#" target="_blank" rel="noopener">Открыть PDF</a>
    <button type="button" id="evidenceClose" class="secondary">Закрыть</button>
  </div>
  <p id="evidenceQuote"></p>
  <p id="imageError" hidden>Превью недоступно. Номер страницы и цитата указаны выше.</p>
  <img id="preview" alt="Страница PDF с подсветкой источника">
</dialog>
<script>
  setTimeout(function () {
    var view = document.getElementById("view");
    if (view && !view.children.length) document.getElementById("bootError").hidden = false;
  }, 4000);
</script>
</body>
</html>
