<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор выгрузки · ВИНИТИ</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/constructor.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">ВИНИТИ <span>конструктор выгрузки</span></div>
  <div class="area-switch" role="tablist" aria-label="Область">
    <button id="areaSolar" type="button" class="area" data-area="solar" role="tab">solar</button>
    <button id="areaRag" type="button" class="area" data-area="rag" role="tab">rag</button>
  </div>
</header>

<main class="layout">
  <aside class="controls">
    <section class="control">
      <label class="field-label" for="tableSelect">Таблица</label>
      <select id="tableSelect"></select>
    </section>

    <section class="control">
      <div class="control-head">
        <span class="field-label">Колонки</span>
        <div class="btn-row">
          <button id="allCols" type="button" class="mini">Все</button>
          <button id="reqCols" type="button" class="mini">Обязат.</button>
          <button id="resetCols" type="button" class="mini">Сброс</button>
        </div>
      </div>
      <div id="columns" class="columns"></div>
    </section>

    <section class="control">
      <span class="field-label">Фильтры</span>
      <div id="filters" class="filters"></div>
      <button id="addFilter" type="button" class="mini">+ Фильтр</button>
    </section>

    <section class="control">
      <span class="field-label">Сортировка</span>
      <div class="sort-row">
        <select id="sortField"></select>
        <select id="sortDir" aria-label="Направление">
          <option value="asc">по возр.</option>
          <option value="desc">по убыв.</option>
        </select>
      </div>
    </section>

    <section class="control">
      <label class="field-label" for="limit">Лимит строк (0 - без предела)</label>
      <input id="limit" type="number" min="0" step="1" value="500">
    </section>

    <div class="actions">
      <button id="apply" type="button" class="primary">Применить</button>
      <a id="download" class="btn" href="#">Скачать CSV</a>
      <a id="downloadFull" class="btn ghost" href="#">Скачать полную сдачу</a>
      <p class="hint" id="exportHint"></p>
    </div>
  </aside>

  <section class="result">
    <div class="result-head">
      <span id="count" class="count"></span>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" hidden></div>
    </div>
  </section>
</main>
</body>
</html>
